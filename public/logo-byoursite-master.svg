<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 420" role="img" aria-labelledby="title desc">
  <title id="title">BYOURSITE / SIDE</title>
  <desc id="desc">Logo tipografico BYOURSITE con SIDE sovrapposto</desc>
  <defs>
    <linearGradient id="siteGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78D9F4"/>
      <stop offset="1" stop-color="#35AFCF"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B6A0E8"/>
      <stop offset="1" stop-color="#8F79C8"/>
    </linearGradient>
  </defs>
  <g transform="translate(18 12)">
    <text x="0" y="270" fill="#F5F7FA"
      font-family="Arial, Helvetica, sans-serif" font-size="286" font-weight="800" letter-spacing="-18">BYOUR</text>
    <text x="800" y="226" fill="url(#siteGrad)"
      font-family="Arial, Helvetica, sans-serif" font-size="190" font-weight="600" letter-spacing="-8">SITE</text>
    <text x="710" y="365" fill="url(#sideGrad)"
      font-family="Georgia, 'Times New Roman', serif" font-size="210" font-weight="400" font-style="italic" letter-spacing="-12">SIDE</text>
  </g>
</svg>
